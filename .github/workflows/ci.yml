name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for Praxsuite secret keys and hardcoded workspaces
        run: |
          if grep -rEn 'sk_live_[A-Za-z0-9]{16,}' \
               --include='*.ts' --include='*.js' --include='*.json' --include='*.md' \
               --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::A Praxsuite secret key is present in this public repository."
            exit 1
          fi
          echo "No secret keys found."
