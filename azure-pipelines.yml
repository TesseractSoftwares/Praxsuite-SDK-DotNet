# Praxsuite SDK for .NET - validate, pack, and mirror to GitHub
#
# PR and development: validate only.
# master:             validate, pack a NuGet package, mirror the source to the public GitHub
#                     repo, and cut a GitHub Release carrying the .nupkg.
#
# Validation builds BOTH target frameworks and runs the offline suite - 41 tests, no network and
# no workspace needed. A break in either target is a break for a consumer, so both are built.

# There is deliberately no paths: exclude here. Excluding README.md looks like an easy saving,
# but the mirror-to-GitHub step in this pipeline IS how the public repo gets updated - so a
# documentation-only change would never reach a single reader. Running the suite for a typo fix is
# the cheaper mistake.
trigger:
  branches:
    include:
      - master
      - development

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-DotNet'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Build and test'
  jobs:
    - job: Validate
      steps:
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '9.0.x'

        - script: dotnet restore
          displayName: 'Restore'

        - script: dotnet build -c Release --no-restore
          displayName: 'Build netstandard2.1 and net8.0'

        - script: >
            dotnet test -c Release --no-build
            --logger trx --results-directory $(Agent.TempDirectory)/testresults
          displayName: 'Run tests'

        - task: PublishTestResults@2
          displayName: 'Publish test results'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'VSTest'
            testResultsFiles: '**/*.trx'
            searchFolder: '$(Agent.TempDirectory)/testresults'
            failTaskOnFailedTests: true

        # This repo is mirrored to a PUBLIC GitHub repo, so a key committed here reaches every
        # consumer. A workspace GUID is not cosmetic either: /auth/config is unauthenticated, so
        # the GUID alone is enough to fetch that workspace's publishable key.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}' \
                 --include='*.cs' --include='*.csproj' --include='*.json' --include='*.md' \
                 --include='*.yml' --exclude-dir=bin --exclude-dir=obj --exclude-dir=.git . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Pack and mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '9.0.x'

        - task: AzureKeyVault@2
          displayName: 'Read GitHub token'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN'
            RunAsPreJob: false

        # The csproj is the single source of truth for the release tag, so a release can never
        # disagree with the package version consumers actually install.
        - script: |
            set -e
            VERSION=$(grep -m1 '<Version>' src/Praxsuite.Sdk/Praxsuite.Sdk.csproj | sed -e 's/.*<Version>//' -e 's/<\/Version>.*//')
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]No <Version> element in Praxsuite.Sdk.csproj."
              exit 1
            fi
            echo "Package version: $VERSION"
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
          displayName: 'Read package version'

        - script: |
            set -e
            dotnet pack src/Praxsuite.Sdk/Praxsuite.Sdk.csproj -c Release \
              -o "$(Build.ArtifactStagingDirectory)/package"
            ls -la "$(Build.ArtifactStagingDirectory)/package/"
          displayName: 'Pack NuGet package'

        # An artifact that exists is not an artifact that works. The TypeScript SDK published a
        # 7 KB tarball containing no code, and every gate in that pipeline passed because each one
        # checked for the artifact's presence and its "uploaded" state - never its contents.
        - script: |
            set -e
            PKG=$(ls "$(Build.ArtifactStagingDirectory)/package/"*.nupkg | grep -v '\.snupkg$' | head -1)
            # Both target frameworks must be present: shipping one silently drops every consumer
            # on the other.
            DLLS=$(python3 -c "
            import sys, zipfile
            names = zipfile.ZipFile(sys.argv[1]).namelist()
            print('\n'.join(n for n in names if n.endswith('.dll')))
            " "$PKG")
            echo "$DLLS"
            N=$(echo "$DLLS" | grep -c 'Praxsuite.Sdk.dll' || true)
            if [ "$N" -lt 2 ]; then
              echo "##vso[task.logissue type=error]Expected Praxsuite.Sdk.dll for both target frameworks, found $N."
              exit 1
            fi
          displayName: 'Verify the package carries both assemblies'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish package artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
            ArtifactName: 'nuget-package'

        # The mirror must not overwrite history it does not contain. --force-with-lease was used
        # here, preceded by a fetch, which cannot protect anything: fetching sets the
        # remote-tracking ref to whatever GitHub currently has, so the lease always matches and
        # the push always wins. It silently reset commits pushed straight to a sibling SDK's
        # mirror, twice.
        - script: |
            set -e
            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:$(GITHUB-SDK-MIRROR-TOKEN)@github.com/$(githubRepo).git"
            # Read the mirror's head BEFORE fetching, so the check is against what GitHub
            # actually has rather than against a ref the fetch just overwrote.
            REMOTE_SHA=$(git ls-remote github refs/heads/master | cut -f1)
            if [ -n "$REMOTE_SHA" ]; then
              git fetch github master
              if ! git merge-base --is-ancestor "$REMOTE_SHA" HEAD; then
                echo "##vso[task.logissue type=error]github.com/$(githubRepo) is at $REMOTE_SHA, which is not an ancestor of this build. Someone pushed to the mirror directly. Reconcile it - do not overwrite."
                exit 1
              fi
            fi

            echo "Mirroring master to github.com/$(githubRepo)"
            if ! git push github HEAD:refs/heads/master; then
              echo "##vso[task.logissue type=error]Mirror push failed. Check the token has contents:write on the mirror."
              exit 1
            fi
            echo "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Idempotent: an existing tag is a no-op, so re-running a build never fails.
        - script: |
            set -e
            TAG="v$(pkgVersion)"
            API="https://api.github.com/repos/$(githubRepo)"
            AUTH="Authorization: Bearer $(GITHUB-SDK-MIRROR-TOKEN)"

            # "Already exists" is not on its own good enough to report success. A release
            # created by a run that then failed its upload has no asset, and an early exit here
            # would report green forever while nobody could download anything - the exact failure
            # the verification at the end of this step exists to catch, skipped by the shortcut
            # above it. Praxsuite-SDK-Lua has a stale 0.1 tag in that state.
            if curl -sSf -o /tmp/existing.json -H "$AUTH" "$API/releases/tags/$TAG" 2>/dev/null; then
              if grep -q '"state": *"uploaded"' /tmp/existing.json; then
                echo "Release $TAG already exists with an asset attached - nothing to publish."
                exit 0
              fi
              echo "##vso[task.logissue type=error]Release $TAG exists but has no asset attached. A previous run created it and failed to upload. Delete the release (or attach the asset by hand) and re-run."
              exit 1
            fi

            NOTES="Install: dotnet add package Praxsuite.Sdk -- see CHANGELOG.md for what changed."
            RELEASE=$(curl -sSf -X POST -H "$AUTH" "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Praxsuite SDK for .NET $(pkgVersion)\",\"body\":\"$NOTES\",\"draft\":false,\"prerelease\":false}")

            RELEASE_ID=$(echo "$RELEASE" | grep -o '"id": *[0-9]*' | head -1 | tr -dc '0-9')
            if [ -z "$RELEASE_ID" ]; then
              echo "##vso[task.logissue type=error]Could not read the release id from the GitHub response."
              exit 1
            fi
            PKG=$(ls "$(Build.ArtifactStagingDirectory)/package/"*.nupkg | grep -v '\.snupkg$' | head -1)

            curl -sSf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary @"$PKG" \
              "https://uploads.github.com/repos/$(githubRepo)/releases/$RELEASE_ID/assets?name=${PKG##*/}"

            # Verify rather than trust: assert the asset is actually attached. The first
            # release cut by this pipeline reported success while uploading nothing.
            ASSETS=$(curl -sSf -H "$AUTH" "$API/releases/tags/$TAG" | grep -c '"state": *"uploaded"' || true)
            if [ "$ASSETS" -lt 1 ]; then
              echo "##vso[task.logissue type=error]Release $TAG was created but no asset attached. Check the upload URL and the asset name."
              exit 1
            fi

            echo "Published release $TAG with $ASSETS asset(s)"
          displayName: 'Cut GitHub release'
